[general]
psize = 1.068
downsample = 4

[preprocessing]
lowpass_mode = bilateral
d = 17
sigmaColor = 71
sigmaSpace = 71

[segmentation]
model_type = vit_l
device = cuda:0
points_per_side = 36
points_per_batch = 16
pred_iou_thresh = 0.9
stability_score_thresh = 0.9
crop_n_layers = 1
crop_n_points_downscale_factor = 2
crop_nms_thresh = 0.1
min_mask_region_area = 100

[filters]
area_min = 2.5e3
area_max = 1e5
roundness_min = 0.75
roundness_max = 1

[filtering]
membrane_band_a = 40
mask_filename_template = {micrograph_uid}_vesicles_filtered.pkl
local_micrographs = true

[vesicle_picker]
package_dir = /nfs/bartesaghilab2/mm1229/segmentation_code/vesicle-picker/vesicle_picker
root_dir = /nfs/bartesaghilab2/mm1229/segmentation_code/vesicle-picker

[dataset.raw]
particle_export_dir = /nfs/bartesaghilab2/zy223/cryosparc/Prestin/CS-prestin/exports/groups/J71_particles
micrographs_dir = /nfs/bartesaghilab2/zy223/denoising/data/fuller_subset
notes = Raw fuller subset micrographs. Particle CTF fields live in the particle export directory.

[dataset.draco]
particle_export_dir = /nfs/bartesaghilab2/zy223/cryosparc/Prestin/CS-prestin/exports/groups/J70_particles
micrographs_dir = /nfs/bartesaghilab2/zy223/denoising/results/draco_pretrained_fuller_subset
notes = Draco-denoised fuller subset micrographs. Particle CTF fields live in the particle export directory.
