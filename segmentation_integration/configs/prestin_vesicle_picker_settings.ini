[general]
psize = 1.068
downsample = 4

[preprocessing]
lowpass_mode = bilateral
d = 17
sigmaColor = 71
sigmaSpace = 71

[segmentation]
model_type = vit_l
device = cuda:0
points_per_side = 36
points_per_batch = 16
pred_iou_thresh = 0.9
stability_score_thresh = 0.9
crop_n_layers = 1
crop_n_points_downscale_factor = 2
crop_nms_thresh = 0.1
min_mask_region_area = 100

[filters]
area_min = 2.5e3
area_max = 1e5
roundness_min = 0.75
roundness_max = 1

[filtering]
membrane_band_a = 40
mask_filename_template = {micrograph_uid}_vesicles_filtered.pkl

